<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="fadeRight" x1="0" x2="1">
      <stop offset="0%" stop-color="#7fb34a" stop-opacity="1"/>
      <stop offset="78%" stop-color="#7fb34a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7fb34a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fairwayStripes" width="70" height="260" patternUnits="userSpaceOnUse">
      <rect width="35" height="260" fill="#84bd4c" opacity="0.42"/>
      <rect x="35" width="35" height="260" fill="#6ea73f" opacity="0.35"/>
    </pattern>
    <radialGradient id="treeGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#9cbf37"/>
      <stop offset="65%" stop-color="#477821"/>
      <stop offset="100%" stop-color="#285018"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" fill="none"/>

  <!-- rough grass / amorphic perimeter -->
  <path d="M30,72
           C75,20 140,30 205,34
           C260,4 330,32 385,28
           C445,10 520,44 575,30
           C650,18 725,28 785,38
           C850,44 884,72 900,88
           L900,172
           C860,212 790,212 735,220
           C660,250 595,220 540,232
           C455,250 405,214 330,226
           C255,244 220,206 155,220
           C90,226 45,202 24,172
           C4,140 6,100 30,72 Z"
        fill="url(#fadeRight)" opacity="0.92" filter="url(#softBlur)"/>

  <!-- fairway, intentionally continuing off right edge -->
  <path d="M105,120
           C180,76 275,90 355,96
           C455,104 520,75 610,89
           C700,104 765,95 900,86
           L900,174
           C785,166 720,174 625,164
           C515,152 470,184 365,165
           C275,148 195,184 105,138 Z"
        fill="#84bd4c" opacity="0.82"/>
  <clipPath id="fairwayClip">
    <path d="M105,120
           C180,76 275,90 355,96
           C455,104 520,75 610,89
           C700,104 765,95 900,86
           L900,174
           C785,166 720,174 625,164
           C515,152 470,184 365,165
           C275,148 195,184 105,138 Z"/>
  </clipPath>
  <rect x="90" y="70" width="850" height="120" fill="url(#fairwayStripes)" clip-path="url(#fairwayClip)" opacity="0.95"/>

  <!-- tee box -->
  <rect x="44" y="101" width="45" height="58" rx="8" fill="#50762b" stroke="#294719" stroke-width="3"/>
  <rect x="61" y="116" width="13" height="28" rx="2" fill="#b4d46b"/>
  <circle cx="102" cy="130" r="10" fill="#fff" stroke="#178724" stroke-width="3"/>

  <!-- foliage dots -->
  <g opacity="0.95">
    <circle cx="58" cy="63" r="20" fill="url(#treeGrad)"/><circle cx="99" cy="49" r="16" fill="url(#treeGrad)"/>
    <circle cx="140" cy="45" r="21" fill="url(#treeGrad)"/><circle cx="185" cy="40" r="17" fill="url(#treeGrad)"/>
    <circle cx="235" cy="36" r="20" fill="url(#treeGrad)"/><circle cx="290" cy="37" r="16" fill="url(#treeGrad)"/>
    <circle cx="350" cy="34" r="20" fill="url(#treeGrad)"/><circle cx="420" cy="38" r="18" fill="url(#treeGrad)"/>
    <circle cx="492" cy="40" r="21" fill="url(#treeGrad)"/><circle cx="560" cy="35" r="16" fill="url(#treeGrad)"/>
    <circle cx="630" cy="38" r="20" fill="url(#treeGrad)"/><circle cx="700" cy="39" r="17" fill="url(#treeGrad)"/>
    <circle cx="770" cy="45" r="21" fill="url(#treeGrad)"/><circle cx="840" cy="55" r="18" fill="url(#treeGrad)"/>

    <circle cx="65" cy="198" r="18" fill="url(#treeGrad)"/><circle cx="118" cy="211" r="20" fill="url(#treeGrad)"/>
    <circle cx="175" cy="215" r="17" fill="url(#treeGrad)"/><circle cx="238" cy="218" r="21" fill="url(#treeGrad)"/>
    <circle cx="310" cy="216" r="16" fill="url(#treeGrad)"/><circle cx="380" cy="220" r="19" fill="url(#treeGrad)"/>
    <circle cx="455" cy="222" r="17" fill="url(#treeGrad)"/><circle cx="535" cy="218" r="21" fill="url(#treeGrad)"/>
    <circle cx="610" cy="217" r="17" fill="url(#treeGrad)"/><circle cx="690" cy="212" r="20" fill="url(#treeGrad)"/>
    <circle cx="775" cy="207" r="18" fill="url(#treeGrad)"/><circle cx="850" cy="197" r="20" fill="url(#treeGrad)"/>
  </g>
</svg>